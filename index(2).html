<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saint Vincent and the Grenadines — Key Statistics</title>
<style>
:root{--navy:#07195b;--blue:#0b68d9;--blue2:#54bff1;--ink:#0b1f63;--muted:#60739a;--gold:#d88916;--gold2:#f3bd51;--green:#278653;--green2:#72c98f}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 0%,rgba(78,177,242,.13),transparent 28%),linear-gradient(180deg,#fff,#f2f9ff 62%,#eef7fb)}
.wrap{width:100%;padding:14px 14px 28px}.hero,.pillar{border:1px solid rgba(54,116,187,.15);border-radius:22px;box-shadow:0 10px 28px rgba(20,66,137,.09);overflow:hidden}
.hero{position:relative;padding:26px 30px;margin-bottom:18px;background:linear-gradient(115deg,#fff 0%,#fcfeff 48%,#dff4ff 100%)}
.hero:after{content:"";position:absolute;width:460px;height:460px;border-radius:50%;right:-180px;top:-230px;background:radial-gradient(circle,rgba(50,170,241,.35),transparent 67%)}
.hero h1{margin:0 0 9px;font-size:44px;letter-spacing:-.8px;position:relative;z-index:1}.hero p{margin:0;max-width:980px;color:#35577f;line-height:1.5;font-size:15px;position:relative;z-index:1}
.pillar{margin:18px 0;background:#fff}.social{background:linear-gradient(180deg,#f9fcff,#edf7ff)}.economic{background:linear-gradient(180deg,#fffef9,#fff6df)}.environment{background:linear-gradient(180deg,#f8fcf9,#eaf7ee)}
.head{display:flex;align-items:center;gap:12px;padding:11px 17px;color:white;min-height:72px}.social .head{background:linear-gradient(90deg,#0a62d3,#1a99eb 54%,#55c4f5)}.economic .head{background:linear-gradient(90deg,#b46a08,#df9017 54%,#f4bd50)}.environment .head{background:linear-gradient(90deg,#227a4a,#329b62 54%,#72c98f)}
.badge{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);font-size:23px}.head h2{margin:0;font-size:28px}
.cards{display:grid;gap:11px;padding:13px}.social .cards,.economic .cards{grid-template-columns:repeat(5,minmax(0,1fr))}.environment .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-width:0;min-height:152px;display:flex;gap:12px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#fff,#f7fbff);border:1px solid rgba(45,108,181,.13);box-shadow:0 7px 17px rgba(18,69,132,.06)}
.economic .card{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.16)}.environment .card{background:linear-gradient(145deg,#fff,#f3faf5);border-color:rgba(45,135,79,.14)}
.icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;font-size:20px;background:#e5f2ff;color:#0a65cf}.economic .icon{background:#ffedc8;color:#b46b0b}.environment .icon{background:#dff3e5;color:#2b8654}
.label{font-size:12.4px;font-weight:800;line-height:1.22;margin-bottom:7px}.value{font-size:clamp(21px,1.7vw,28px);font-weight:900;line-height:1.03;letter-spacing:-.3px}.period{font-size:11.2px;color:#61769c;line-height:1.32;margin-top:7px}.source{font-size:9.7px;line-height:1.28;color:#3d5d88;margin-top:8px}
a{color:#456fa6;text-decoration:underline;text-underline-offset:2px}.visual-band{padding:0 13px 14px}.visual-kicker{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin:3px 2px 9px;color:#527399}.economic .visual-kicker{color:#a36b11}.environment .visual-kicker{color:#34754f}
.visual{border-radius:18px;padding:16px 18px;background:linear-gradient(145deg,#fff,#f5fbff);border:1px solid rgba(45,108,181,.13);box-shadow:0 8px 19px rgba(18,69,132,.06);overflow:hidden}.economic .visual{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.15)}.environment .visual{background:linear-gradient(145deg,#fff,#f2faf4);border-color:rgba(45,135,79,.14)}
.visual h3{margin:0 0 4px;font-size:22px}.sub{font-size:12.2px;color:#61769b;margin-bottom:18px}.compare{display:grid;gap:22px;margin:26px 0 18px}.crow,.barrow{display:grid;grid-template-columns:80px 1fr 145px;gap:12px;align-items:center}.track{height:30px;border-radius:999px;background:#f2e5ca;overflow:hidden}.environment .track{background:#dfeee4}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#d88916,#f3bd51)}.fill.diesel{background:#2c8ed6}.fill.hydro{background:#47b7ba}.fill.solar{background:#75c989}.blabel{font-size:13px;font-weight:800}.bvalue{text-align:right;font-size:12px;font-weight:800}
.callout{margin-top:20px;padding:14px 16px;border-radius:14px;background:rgba(243,189,81,.16);color:#72521a;font-size:13px;line-height:1.4}.callout strong{font-size:22px;color:#b46a08;margin-right:7px}.footer{display:flex;justify-content:space-between;gap:18px;margin-top:16px;padding:14px 8px 2px;border-top:1px solid rgba(47,109,180,.12);font-size:12px;color:#526884}
@media(max-width:1100px){.social .cards,.economic .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.environment .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.social .cards,.economic .cards,.environment .cards{grid-template-columns:1fr}.hero h1{font-size:34px}.crow,.barrow{grid-template-columns:1fr}.bvalue{text-align:left}}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function ico(l){l=l.toLowerCase();if(l.includes("population"))return"👥";if(l.includes("labour"))return"⚙";if(l.includes("unemployment"))return"↘";if(l.includes("life")||l.includes("mortality"))return"♥";if(l.includes("gdp"))return"↗";if(l.includes("inflation"))return"%";if(l.includes("visitor"))return"✈";if(l.includes("trade"))return"▣";if(l.includes("economic zone"))return"≈";if(l.includes("land area"))return"◆";if(l.includes("protected"))return"◉";if(l.includes("waste"))return"♻";return"•"}
function cards(xs){return `<div class="cards">${xs.map(x=>`<div class="card"><div class="icon">${ico(x.label)}</div><div><div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div><div class="period">${esc(x.period)}</div><div class="source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">${esc(x.source)}</a></div></div></div>`).join("")}</div>`}
function section(cls,title,inner){const badge=cls==="social"?"👥":cls==="economic"?"↗":"❧";return `<section class="pillar ${cls}"><div class="head"><div class="badge">${badge}</div><h2>${title}</h2></div>${inner}</section>`}
function tourism(v){const max=Math.max(...v.series.map(x=>x.value));return `<div class="visual-band"><div class="visual-kicker">Tourism</div><div class="visual"><h3>${esc(v.title)}</h3><div class="sub">${esc(v.subtitle)} · Source: <a href="${esc(v.sourceUrl)}" target="_blank" rel="noopener">${esc(v.source)}</a></div><div class="compare">${v.series.map(x=>`<div class="crow"><div class="blabel">${esc(x.label)}</div><div class="track"><div class="fill" style="width:${(x.value/max*100).toFixed(1)}%"></div></div><div class="bvalue">${x.value.toLocaleString()}</div></div>`).join("")}</div><div class="callout"><strong>↑ 14%</strong>year-on-year growth in stay-over visitors by September 2025</div></div></div>`}
function energy(v){const max=Math.max(...v.series.map(x=>x.value));return `<div class="visual-band"><div class="visual-kicker">Energy mix</div><div class="visual"><h3>${esc(v.title)}</h3><div class="sub">${esc(v.subtitle)} · Source: <a href="${esc(v.sourceUrl)}" target="_blank" rel="noopener">${esc(v.source)}</a></div>${v.series.map(x=>`<div class="barrow"><div class="blabel">${esc(x.label)}</div><div class="track"><div class="fill ${x.label.toLowerCase()}" style="width:${(x.value/max*100).toFixed(1)}%"></div></div><div class="bvalue">${esc(x.display)}</div></div>`).join("")}</div></div>`}
async function main(){const r=await fetch("./data.json",{cache:"no-store"});if(!r.ok)throw new Error("Could not load data.json");const d=await r.json();const social=cards(d.social.cards);const econ=cards(d.economic.cards)+tourism(d.economic.tourism);const env=cards(d.environment.cards)+energy(d.environment.energyMix);document.getElementById("app").innerHTML=`<main class="wrap"><div class="hero"><h1>${esc(d.meta.title)}</h1><p>${esc(d.meta.subtitle)}</p></div>${section("social","SOCIAL",social)}${section("economic","ECONOMIC",econ)}${section("environment","ENVIRONMENT",env)}<div class="footer"><div>Every indicator links directly to its source.</div><div><strong>Updated:</strong> ${esc(d.meta.lastUpdated)}</div></div></main>`}
main().catch(e=>document.getElementById("app").innerHTML=`<div style="padding:25px">Could not render dashboard: ${esc(e.message)}</div>`);
</script>
</body>
</html>
